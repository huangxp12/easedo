<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EaseDo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="win-strip" data-tauri-drag-region aria-hidden="true"></div>
  <div id="win-ctrls">
    <button id="win-min" title="最小化" tabindex="-1">
      <svg viewBox="0 0 12 12" width="12" height="12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button id="win-close" title="关闭" tabindex="-1">
      <svg viewBox="0 0 12 12" width="12" height="12"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="rail-hot" aria-hidden="true"></div>
  <div id="app">
    <aside id="rail">
      <div class="rail-logo" title="EaseDo">E</div>
      <button class="rail-btn active" data-view="today" title="Today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/></svg>
        <span>Today</span>
      </button>
      <button class="rail-btn" data-view="trace" title="Trace">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2.2"/></svg>
        <span>Trace</span>
      </button>
      <button class="rail-btn" data-view="report" title="周报 / 月报">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M14 3.5V8h5M10 12.5h5.5M10 16h5.5"/></svg>
        <span>报告</span>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="btn-settings" title="设置存储目录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        <span>设置</span>
      </button>
      <div class="rail-foot">0.2</div>
    </aside>

    <main id="main">
      <!-- ============ Today ============ -->
      <section id="view-today" class="view active">
        <header class="today-head" data-tauri-drag-region>
          <div class="today-date" data-tauri-drag-region>
            <h1 id="date-big" data-tauri-drag-region>—</h1>
            <div class="date-sub" id="date-sub" data-tauri-drag-region></div>
          </div>
          <div class="today-progress" id="today-progress" data-tauri-drag-region hidden>
            <div class="prog-num" id="prog-num" data-tauri-drag-region></div>
            <div class="prog-bar" data-tauri-drag-region><i id="prog-fill"></i></div>
          </div>
        </header>
        <div class="editor-wrap">
          <div id="editor" spellcheck="false"></div>
          <div class="editor-hint" id="editor-hint">回车新建 · Tab 缩进 · 点框完成 · 右键导入往日 · 左缘呼出侧栏 · 悬停顶部看日期</div>
        </div>
      </section>

      <!-- ============ Trace ============ -->
      <section id="view-trace" class="view">
        <div class="trace-grid">
          <aside class="trace-days panel">
            <div class="pane-title">日期</div>
            <div id="trace-daylist" class="daylist"></div>
          </aside>
          <div class="trace-detail" id="trace-detail">
            <div class="empty-hint">选择左侧日期，回看当天每条任务的一生</div>
          </div>
        </div>
      </section>

      <!-- ============ 报告 ============ -->
      <section id="view-report" class="view">
        <div class="report-wrap">
          <h2 class="view-title">周报与月报</h2>
          <p class="view-sub">基于任务快照自动汇总，导出为 Markdown 与 HTML 双格式</p>
          <div class="report-cards">
            <div class="report-card panel">
              <div class="report-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
              </div>
              <div class="report-name" id="week-label">本周周报</div>
              <div class="report-range" id="week-range"></div>
              <button class="btn primary" id="btn-week">生成并导出</button>
            </div>
            <div class="report-card panel">
              <div class="report-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M14 3.5V8h5M10 12.5h5.5M10 16h5.5"/></svg>
              </div>
              <div class="report-name" id="month-label">本月月报</div>
              <div class="report-range" id="month-range"></div>
              <button class="btn primary" id="btn-month">生成并导出</button>
            </div>
          </div>
          <div id="report-result"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" role="status"></div>

  <script src="core.js"></script>
  <script src="editor.js"></script>
  <script src="trace.js"></script>
  <script src="report.js"></script>
  <script src="main.js"></script>
</body>
</html>
